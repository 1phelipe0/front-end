<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - Estável</title>
    <style>
        body { margin: 0; background: #020205; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { display: block; margin: 0 auto; background: #000; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        .stat { font-size: 20px; color: #00ffcc; font-weight: bold; }

        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #restartBtn {
            padding: 15px 40px;
            font-size: 24px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #restartBtn:hover {
            background: #00ccaa;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">VIDAS: <span id="playerHP">3</span></div>
</div>

<div id="gameOverScreen">
    <h1 style="color: #ff4444; margin: 0;">GAME OVER</h1>
    <button id="restartBtn">RESTART</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gameOverScreen = document.getElementById("gameOverScreen");
const restartBtn = document.getElementById("restartBtn");

// Ajuste dinâmico de tela
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const keys = {};
let player = { x: canvas.width/2, y: canvas.height - 100, w: 40, h: 40, speed: 6, hp: 3, lastShot: 0 };

let projectiles = [];
let enemyProjectiles = [];
let enemies = [];
let obstacles = [];
let powerups = [];

window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// ====================== FUNÇÃO DE RESET ======================
function resetGame() {
    player.x = canvas.width/2;
    player.y = canvas.height - 100;
    player.hp = 3;
    
    projectiles = [];
    enemyProjectiles = [];
    enemies = [];
    obstacles = [];
    powerups = [];
    
    gameOverScreen.style.display = "none";
    document.getElementById("playerHP").innerText = player.hp;
}
// ===========================================================

restartBtn.addEventListener("click", resetGame);

// Funções de criação (Spawners)
function spawnEnemy() {
    if (player.hp > 0) enemies.push({ x: Math.random() * (canvas.width - 40), y: -50, w: 40, h: 40, hp: 7, speed: 2, lastShot: 0 });
}
function spawnObstacle() {
    if (player.hp > 0) obstacles.push({ x: Math.random() * (canvas.width - 50), y: -60, w: 50, h: 50, hp: 3, speed: 2 });
}
function spawnPowerUp() {
    if (player.hp > 0) powerups.push({ x: Math.random() * (canvas.width - 20), y: -20, w: 25, h: 25, speed: 2 });
}

setInterval(spawnEnemy, 2500);
setInterval(spawnObstacle, 4000);
setInterval(spawnPowerUp, 15000);

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.w &&
           rect1.x + rect1.w > rect2.x &&
           rect1.y < rect2.y + rect2.h &&
           rect1.y + rect1.h > rect2.y;
}

function update() {
    if (player.hp <= 0) return;

    // Movimentação
    if ((keys["ArrowLeft"] || keys["KeyA"]) && player.x > 0) player.x -= player.speed;
    if ((keys["ArrowRight"] || keys["KeyD"]) && player.x < canvas.width - player.w) player.x += player.speed;
    if ((keys["ArrowUp"] || keys["KeyW"]) && player.y > 0) player.y -= player.speed;
    if ((keys["ArrowDown"] || keys["KeyS"]) && player.y < canvas.height - player.h) player.y += player.speed;

    // Tiro do Player
    if (keys["Space"] && Date.now() - player.lastShot > 250) {
        projectiles.push({ x: player.x + player.w/2 - 2, y: player.y, w: 5, h: 15, speed: 8 });
        player.lastShot = Date.now();
    }

    projectiles = projectiles.filter(p => {
        p.y -= p.speed;
        return p.y > -20;
    });

    // Inimigos
    enemies.forEach((en, index) => {
        en.y += 1;
        if (en.x < player.x) en.x += 1; else en.x -= 1;

        if (Date.now() - en.lastShot > 2000) {
            enemyProjectiles.push({ x: en.x + en.w/2, y: en.y + en.h, w: 5, h: 10, speed: 5 });
            en.lastShot = Date.now();
        }

        projectiles.forEach((p, pIndex) => {
            if (checkCollision(p, en)) {
                en.hp--;
                projectiles.splice(pIndex, 1);
                if (en.hp <= 0) enemies.splice(index, 1);
            }
        });
    });
    enemies = enemies.filter(en => en.y < canvas.height);

    // Obstáculos
    obstacles.forEach((ob, index) => {
        ob.y += ob.speed;
        if (checkCollision(player, ob)) {
            player.hp--;
            obstacles.splice(index, 1);
        }
        projectiles.forEach((p, pIndex) => {
            if (checkCollision(p, ob)) {
                ob.hp--;
                projectiles.splice(pIndex, 1);
                if (ob.hp <= 0) obstacles.splice(index, 1);
            }
        });
    });
    obstacles = obstacles.filter(ob => ob.y < canvas.height);

    // Tiros inimigos
    enemyProjectiles = enemyProjectiles.filter(ep => {
        ep.y += ep.speed;
        if (checkCollision(ep, player)) {
            player.hp--;
            return false;
        }
        return ep.y < canvas.height;
    });

    // Powerups
    powerups.forEach((pw, index) => {
        pw.y += pw.speed;
        if (checkCollision(player, pw)) {
            if (player.hp < 3) player.hp++;
            powerups.splice(index, 1);
        }
    });
    powerups = powerups.filter(pw => pw.y < canvas.height);

    document.getElementById("playerHP").innerText = player.hp;

    // Verifica Game Over
    if (player.hp <= 0) {
        gameOverScreen.style.display = "flex";
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desenha Player
    ctx.fillStyle = "#00ccff";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Desenha Inimigos
    ctx.fillStyle = "#ff4444";
    enemies.forEach(en => {
        ctx.fillRect(en.x, en.y, en.w, en.h);
        ctx.fillStyle = "white";
        ctx.font = "16px sans-serif";
        ctx.fillText(en.hp, en.x + 15, en.y - 5);
        ctx.fillStyle = "#ff4444";
    });

    // Desenha Obstáculos
    ctx.fillStyle = "#777";
    obstacles.forEach(ob => ctx.fillRect(ob.x, ob.y, ob.w, ob.h));

    // Desenha Powerups
    ctx.fillStyle = "#00ff00";
    powerups.forEach(pw => {
        ctx.fillRect(pw.x + 10, pw.y, 5, 25);
        ctx.fillRect(pw.x, pw.y + 10, 25, 5);
    });

    // Desenha Tiros
    ctx.fillStyle = "yellow";
    projectiles.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
    ctx.fillStyle = "orange";
    enemyProjectiles.forEach(ep => ctx.fillRect(ep.x, ep.y, ep.w, ep.h));

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
